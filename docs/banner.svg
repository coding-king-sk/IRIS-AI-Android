<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="IRIS AI - Offline-first Android voice assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#07090a"/>
      <stop offset="100%" stop-color="#04120a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#00ff41" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" fill="none" stroke="#00ff41" stroke-opacity="0.25"/>

  <!-- AI core orb -->
  <g transform="translate(250 190)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="92" fill="none" stroke="url(#ring)" stroke-opacity="0.85" stroke-width="1.6"/>
    <circle r="72" fill="none" stroke="#00ff41" stroke-opacity="0.45" stroke-width="1"/>
    <ellipse rx="92" ry="30" fill="none" stroke="#00ff41" stroke-opacity="0.5" stroke-width="1.2"/>
    <ellipse rx="92" ry="30" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.2" transform="rotate(60)"/>
    <ellipse rx="92" ry="30" fill="none" stroke="#00ff41" stroke-opacity="0.35" stroke-width="1.2" transform="rotate(-60)"/>
    <circle r="26" fill="#00ff41" fill-opacity="0.18"/>
    <circle r="12" fill="#00ff41"/>
    <circle cx="92" cy="0" r="4" fill="#22d3ee"/>
    <circle cx="-64" cy="-64" r="3" fill="#00ff41"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Courier New', monospace">
    <text x="470" y="120" fill="#71717a" font-size="16" letter-spacing="7">OFFLINE-FIRST VOICE LAYER</text>
    <text x="466" y="212" fill="#00ff41" font-size="96" font-weight="bold" letter-spacing="12">IRIS AI</text>
    <text x="470" y="252" fill="#e4e4e7" font-size="20" letter-spacing="2">Jarvis-style Android assistant · Kotlin + Compose</text>

    <g font-size="13" letter-spacing="2">
      <rect x="470" y="286" width="148" height="34" rx="17" fill="#00ff41" fill-opacity="0.12" stroke="#00ff41" stroke-opacity="0.35"/>
      <text x="493" y="308" fill="#00ff41">ANDROID 10+</text>
      <rect x="630" y="286" width="168" height="34" rx="17" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="651" y="308" fill="#22d3ee">41 LOCAL TOOLS</text>
      <rect x="810" y="286" width="188" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="830" y="308" fill="#e4e4e7">HINGLISH COMMANDS</text>
    </g>
  </g>

  <!-- waveform -->
  <g stroke="#00ff41" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="1040" y1="180" x2="1040" y2="200"/>
    <line x1="1058" y1="160" x2="1058" y2="220"/>
    <line x1="1076" y1="135" x2="1076" y2="245"/>
    <line x1="1094" y1="110" x2="1094" y2="270"/>
    <line x1="1112" y1="140" x2="1112" y2="240"/>
    <line x1="1130" y1="165" x2="1130" y2="215"/>
    <line x1="1148" y1="178" x2="1148" y2="202"/>
  </g>
</svg>
