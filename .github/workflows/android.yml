name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/iris-release.jks"
            echo "IRIS_KEYSTORE=$GITHUB_WORKSPACE/iris-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore ready."
          else
            echo "No KEYSTORE_BASE64 secret found - release APK will be debug-signed."
          fi

      - name: Assemble debug and release APKs
        env:
          IRIS_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IRIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IRIS-AI-v1.0.0-debug.apk
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$RELEASE_APK" dist/IRIS-AI-v1.0.0-release.apk
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iris-ai-debug
          path: dist/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: IRIS AI v1.0.0
          files: dist/*.apk
